""" time duration: RFCXXX duration string, e.g. 1h30m """
scalar Duration
""" utf8 string """
scalar LabelName
""" map[string]string JSON Raw """
scalar MapString
""" host:port """
scalar HostPort

enum MatchType {
    """ = """
    MatchEqual
    """ != """
    MatchNotEqual
    """ =~ """
    MatchRegexp
    """ !~ """
    MatchNotRegexp
}

type Route {
    receiver: String
    groupBy: [LabelName]
    matchers: [Matcher]
    muteTimeIntervals: [String!]
    activeTimeIntervals: [String!]
    continue: Boolean
    routes: [Route]
    groupWait: Duration
    GroupInterval: Duration
    repeatInterval: Duration
}

type Matcher {
    type: MatchType!
    name: String!
    value: String!
}

type Receiver {
    name: String!
    emailConfigs: [EmailConfig]
    messageConfig: MessageConfig
}

type EmailConfig {
    to: String!
    from: String
    smartHost: HostPort!
    authType: String!
    authUsername: String!
    authPassword: String!
    authSecret: String!
    authIdentity: String!
    headers: MapString
}

type MessageConfig {
    to: String
    subject: String
    redirect: String
}

enum RouteStrType {
    Json
    Yaml
}

extend type MsgType {
    """ 订阅的用户 """
    subscriberUsers:[MsgSubscriber!]!
    """ 订阅的用户组 """
    subscriberRoles:[MsgSubscriber!]!
    """ 排除的用户 """
    excludeSubscriberUsers:[MsgSubscriber!]!
}

extend type MsgEvent {
    routeStr(type: RouteStrType!): String!
}

extend type MsgInternal {
    """消息发送的用户数"""
    toSendCounts:Int!
    """消息已读的用户数"""
    hasReadCounts:Int!
}

type UserInfo {
    userID: String
    name:   String
    email:  String
    mobile: String
}
type FormatMsgAlert{
    id: ID!
    tenantID: Int!
    """开始时间"""
    startsAt: Time!
    """结束时间"""
    endsAt: Time
    """消息事件描述"""
    msgEventComments: String
    """消息通道描述"""
    msgChannelComments: String
    """接收方式"""
    receiverType: MsgTemplateReceiverType!
    """receiver名称"""
    receiver: String!
    """消息模板标题"""
    msgTemplateTitle: String
    """接收用户"""
    users: [UserInfo]
    """是否存在多条消息"""
    hasMultiMsg: Boolean!
    """消息状态"""
    state: MsgAlertAlertStatus!
    createdAt: Time!
}
type FormatMsgAlertEdge {
    node: FormatMsgAlert
    cursor: Cursor!
}
type FormatMsgAlertConnection {
    edges: [FormatMsgAlertEdge]
    pageInfo: PageInfo!
    totalCount: Int!
}

extend type Query {
    """ 消息通道列表 """
    msgChannels(
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: MsgChannelOrder
        where: MsgChannelWhereInput
    ): MsgChannelConnection!

    """ 消息类型列表 """
    msgTypes(
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: MsgTypeOrder
        where: MsgTypeWhereInput
    ): MsgTypeConnection!

    """ 消息类型分类 """
    msgTypeCategories(keyword:String,appID:ID): [String!]!

    """ 消息事件列表 """
    msgEvents(
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: MsgEventOrder
        where: MsgEventWhereInput
    ): MsgEventConnection!

    """ 消息模板列表 """
    msgTemplates(
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: MsgTemplateOrder
        where: MsgTemplateWhereInput
    ): MsgTemplateConnection!

    """ 静默消息 """
    silences(
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: MsgSilenceOrder
        where: MsgSilenceWhereInput
    ):MsgSilenceConnection!

    """消息列表"""
    msgAlerts(
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: MsgAlertOrder
        where: MsgAlertWhereInput
    ):MsgAlertConnection!

    """解析过的消息列表"""
    formatMsgAlerts(
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        alertName: String
        userID: String
        receiverType: MsgTemplateReceiverType
        where: MsgAlertWhereInput
        orderBy: MsgAlertOrder
    ):FormatMsgAlertConnection!

    """查询消息体发送的所有消息"""
    formatMsgAlertMore(
        msgAlertID:ID!
    ):[FormatMsgAlert]

    """展示消息内容"""
    renderMsgAlert(msgAlertID:ID!,receiver: String!):String

    """获取用户的站内信"""
    userMsgInternalTos(
        after: Cursor
        first: Int
        before: Cursor
        last: Int
        orderBy: MsgInternalToOrder
        where: MsgInternalToWhereInput
    ):MsgInternalToConnection!
    """用户订阅的消息分类"""
    userSubMsgCategory:[String!]!
    """消息分类站内信未读数"""
    userUnreadMsgInternalsFromMsgCategory(categories: [String!]!):[Int!]!
    """用户站内信总未读数"""
    userUnreadMsgInternals:Int!
    """根据模板名称获取模板数据"""
    msgTemplateDefineByName(
        """消息类型:文本,网页,需要结合mod确定支持的格式"""
        format: MsgTemplateFormat!
        """消息模板的body数据"""
        body:String!
    ):String!
}