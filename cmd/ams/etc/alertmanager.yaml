route:
  groupBy: [...]
  receiver: "email"
  # 调试时,可以将以下值调低
  groupWait: 5s
  groupInterval: 3m
  repeatInterval: 1h
# 模板文件位置
templates:
  - 'files/*/tpl/*.tmpl'

receivers:
  - name: "internal"
    webhookConfigs:
      - url: "http://127.0.0.1:5001/"
  - name: webhook-dingtalk
    webhookConfigs:
  - name: email
    emailConfigs:
      - authPassword:
        authUsername:
        from: alertmanager@example.com
        requireTLS: false
        smarthost: localhost:1025
        to: alerts@example.com
  - name: message
    messageConfig:
      sendResolved: false
  - name: umeng
    umengConfig:
      sendResolved: false
inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "dev", "instance"]
